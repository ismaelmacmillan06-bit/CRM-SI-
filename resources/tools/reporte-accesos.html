<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reporte de Accesos · MEE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#eaf6f4; --surface:#ffffff; --surface-2:#f3fbfa;
    --ink:#0e1726; --muted:#5b6680; --faint:#8b97ad;
    --border:#dcece9; --border-strong:#bfe0db;
    --primary:#0d9488; --primary-d:#0f766e; --primary-t:#ecfdf9;
    --shadow-sm:0 1px 2px rgba(14,23,38,.06);
    --shadow:0 1px 2px rgba(14,23,38,.05),0 10px 28px rgba(14,23,38,.07);
    --radius:15px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;min-height:100vh}
  body{
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    background:
      radial-gradient(1100px 460px at 88% -8%, #ccfbf1 0%, transparent 60%),
      radial-gradient(900px 420px at 5% 0%, #f0fdfa 0%, transparent 55%),
      var(--bg);
    color:var(--ink); -webkit-font-smoothing:antialiased;
    display:flex; flex-direction:column;
  }

  header.app{
    background:linear-gradient(125deg,#022c22 0%,#0f766e 55%,#0d9488 100%);
    color:#fff;box-shadow:0 10px 30px rgba(2,44,34,.28)}
  .head-inner{max-width:700px;margin:0 auto;padding:15px 24px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
  .logo{width:42px;height:42px;border-radius:12px;flex:none;
    background:linear-gradient(140deg,#2dd4bf,#0d9488);display:grid;place-items:center;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.22),0 6px 16px rgba(13,148,136,.4)}
  .brand{display:flex;flex-direction:column;gap:1px}
  .brand .kicker{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:#99f6e4;font-weight:600}
  .brand h1{font-family:"Space Grotesk",sans-serif;font-size:20px;line-height:1.1;margin:0;font-weight:600;letter-spacing:-.01em}
  .chip{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;font-weight:600;color:#ccfbf1;
    background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);padding:5px 11px;border-radius:999px}
  .chip .dot{width:6px;height:6px;border-radius:50%;background:#2dd4bf}

  .main{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 24px}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:20px;
    box-shadow:var(--shadow);padding:40px 36px;width:100%;max-width:520px;text-align:center}

  .card-icon{width:72px;height:72px;border-radius:20px;margin:0 auto 22px;
    background:linear-gradient(140deg,#2dd4bf,#0d9488);display:grid;place-items:center;
    box-shadow:0 8px 24px rgba(13,148,136,.3)}

  .card h2{font-family:"Space Grotesk",sans-serif;font-size:22px;font-weight:700;margin:0 0 8px;letter-spacing:-.02em}
  .card .sub{font-size:14px;color:var(--muted);line-height:1.6;margin-bottom:24px}

  .badge-soon{display:inline-flex;align-items:center;gap:8px;background:var(--primary-t);color:var(--primary-d);
    border:1px solid var(--border-strong);padding:9px 18px;border-radius:999px;font-size:13px;font-weight:700}

  footer.foot{text-align:center;padding:18px;font-size:12px;color:var(--faint)}
</style>
</head>
<body>

<header class="app">
  <div class="head-inner">
    <div class="logo">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14,2 14,8 20,8"/><path d="M9 15l2 2 4-4"/></svg>
    </div>
    <div class="brand">
      <span class="kicker">Herramientas SI</span>
      <h1>Reporte de Accesos</h1>
    </div>
    <span class="chip" style="margin-left:auto"><span class="dot"></span> MEE</span>
  </div>
</header>

<main class="main">
  <div class="card">
    <div class="card-icon">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14,2 14,8 20,8"/><path d="M9 15l2 2 4-4"/></svg>
    </div>
    <h2>Reporte de Accesos</h2>
    <p class="sub">
      Sube el Excel que entrega el script de accesos (consola) y genera un reporte HTML
      navegable, listo para revisar o compartir con el colegio.
    </p>
    <span class="badge-soon">🚧 En preparación — próximamente</span>
  </div>
</main>

<footer class="foot">Herramienta interna · MacmillanSI</footer>
</body>
</html>
