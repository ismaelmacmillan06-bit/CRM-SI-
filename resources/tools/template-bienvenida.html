<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Template Bienvenida SI · MEE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f1f3f7;
    --surface: #ffffff;
    --surface2: #f8f9fb;
    --ink: #0e1726;
    --muted: #5b6680;
    --faint: #9ba4b8;
    --border: #e3e8f1;
    --accent: #c8102e;
    --accent-d: #a50d24;
    --accent-t: #fff0f2;
    --ok: #059669;
    --radius: 10px;
    --shadow: 0 2px 8px rgba(14,23,38,.08), 0 1px 2px rgba(14,23,38,.04);
    --shadow-lg: 0 20px 48px rgba(14,23,38,.14);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: "Inter", system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }

  /* ── Topbar ── */
  .topbar {
    background: #0e1726;
    color: #fff;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 20px;
    height: 52px;
    flex-shrink: 0;
    border-bottom: 1px solid #1e2d45;
  }
  .topbar-icon { font-size: 18px; }
  .topbar-title { font-size: 14px; font-weight: 600; flex: 1; }
  .topbar-badge {
    font-size: 11px; font-weight: 600; letter-spacing: .04em;
    background: var(--accent); color: #fff;
    padding: 3px 10px; border-radius: 4px;
  }

  /* ── Main layout ── */
  .main {
    display: grid;
    grid-template-columns: 320px 1fr;
    flex: 1;
    overflow: hidden;
  }

  /* ── Form panel ── */
  .panel-form {
    background: var(--surface);
    border-right: 1px solid var(--border);
    overflow-y: auto;
    padding: 24px 20px;
    display: flex;
    flex-direction: column;
    gap: 0;
  }
  .section-label {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--faint);
    margin-bottom: 14px;
  }
  .form-group { margin-bottom: 18px; }
  .form-label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .form-label span {
    font-weight: 400;
    color: var(--faint);
  }
  select, input[type="text"] {
    width: 100%;
    padding: 9px 12px;
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    font-size: 13px;
    font-family: inherit;
    color: var(--ink);
    background: var(--surface);
    outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  select:focus, input[type="text"]:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(200,16,46,.1);
  }
  .consultor-preview {
    margin-top: 10px;
    padding: 12px 14px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    display: none;
  }
  .consultor-preview.visible { display: block; }
  .cp-name { font-size: 13px; font-weight: 700; color: var(--ink); margin-bottom: 4px; }
  .cp-detail { font-size: 11.5px; color: var(--muted); line-height: 1.7; }

  .divider { border: none; border-top: 1px solid var(--border); margin: 20px 0; }

  .hint {
    background: #fffbeb;
    border: 1px solid #fde68a;
    border-radius: var(--radius);
    padding: 12px 14px;
    font-size: 12px;
    color: #78350f;
    line-height: 1.6;
    margin-top: auto;
  }
  .hint strong { display: block; margin-bottom: 4px; }

  /* ── Preview panel ── */
  .panel-preview {
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .preview-toolbar {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 10px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
  }
  .preview-info { flex: 1; }
  .preview-label { font-size: 12px; font-weight: 600; color: var(--ink); }
  .preview-sub { font-size: 11px; color: var(--faint); }
  .status-chip {
    font-size: 11px;
    font-weight: 600;
    padding: 3px 10px;
    border-radius: 20px;
    background: var(--surface2);
    color: var(--muted);
    border: 1px solid var(--border);
  }
  .status-chip.ready {
    background: #ecfdf5;
    color: var(--ok);
    border-color: #a7f3d0;
  }

  .btn-copy {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 8px 18px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: var(--radius);
    font-size: 13px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: background .15s, transform .1s;
  }
  .btn-copy:hover { background: var(--accent-d); }
  .btn-copy:active { transform: scale(.97); }
  .btn-copy.ok { background: var(--ok); }
  .btn-copy:disabled { background: #cbd4e3; cursor: not-allowed; }

  .preview-scroll {
    flex: 1;
    overflow: auto;
    padding: 24px;
    display: flex;
    justify-content: center;
    align-items: flex-start;
  }
  .preview-scroll iframe {
    width: 620px;
    max-width: 100%;
    border: none;
    border-radius: 6px;
    box-shadow: var(--shadow-lg);
    display: block;
  }
</style>
</head>
<body>

    <div class="hint">
      <strong>¿Cómo usarlo en Outlook?</strong>

    </div>
  </div>

  <!-- ── Preview panel ── -->
  <div class="panel-preview">

});

  const v = sel.value;

  updatePreview();
}

function updatePreview() {
  const c       = getConsultor();
  const director = document.getElementById('inputDirector').value.trim();
  const colegio  = document.getElementById('inputColegio').value.trim();
  const html     = buildEmailHTML(c, director, colegio);

  const frame = document.getElementById('previewFrame');
  frame.srcdoc = html;
  frame.onload = () => {
    try {
      const h = frame.contentWindow.document.documentElement.scrollHeight;
      frame.style.height = h + 'px';
    } catch (_) {}
  };

  const ready = c && director && colegio;
  const chip = document.getElementById('statusChip');
  chip.textContent = ready ? '✓ Listo' : 'Incompleto';
  chip.className   = 'status-chip' + (ready ? ' ready' : '');
}

async function copyForOutlook() {
  const c        = getConsultor();
  const director = document.getElementById('inputDirector').value.trim();
  const colegio  = document.getElementById('inputColegio').value.trim();
  const html     = buildEmailHTML(c, director, colegio);

  const btn = document.getElementById('btnCopy');

  try {
    const blob = new Blob([html], { type: 'text/html' });
    await navigator.clipboard.write([new ClipboardItem({ 'text/html': blob })]);
    btn.textContent = '✓ ¡Copiado!';
    btn.classList.add('ok');
    setTimeout(() => {
      btn.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg> Copiar para Outlook`;
      btn.classList.remove('ok');
    }, 2500);
  } catch (err) {
    // Fallback: select all in iframe
    try {
      const frame = document.getElementById('previewFrame');
      const doc = frame.contentWindow.document;
      const range = doc.createRange();
      range.selectNodeContents(doc.body);
      const sel = frame.contentWindow.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
      doc.execCommand('copy');
      btn.textContent = '✓ ¡Copiado!';
      btn.classList.add('ok');
      setTimeout(() => {
        btn.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg> Copiar para Outlook`;
        btn.classList.remove('ok');
      }, 2500);
    } catch (_) {
      alert('Selecciona todo el preview con Ctrl+A dentro del panel derecho y cópialo con Ctrl+C.');
    }
  }
}

updatePreview();
</script>
